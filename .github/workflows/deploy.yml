name: Despliegue Ultrarrápido a GitHub Pages
# Configurado para ejecución directa de 15 segundos mediante GitHub Actions (Settings -> Pages -> Source = GitHub Actions)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar Archivos Estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages Instantáneo
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000

